[package]
name = "mysql-gui"
version = "3.0.2"
edition = "2021"
authors = ["coes"]
description = "Fast, lightweight native MySQL client built with Slint and Rust"

[dependencies]
slint = "1.18.1"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "mysql", "chrono"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
keyring = "2"
dirs = "5.0"
rfd = "0.15"

[build-dependencies]
slint-build = "1.18.1"
