<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Cylinder Front Gradients -->
    <linearGradient id="discGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="discGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Disc Top Rim Gradients -->
    <linearGradient id="discTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Bolt / Dolphin Tail Spark Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Background Ambient Glow behind database stack -->
  <circle cx="256" cy="256" r="140" fill="#0284c7" opacity="0.18" filter="url(#glow)" />

  <!-- Database Cylinder Stack -->
  <!-- Layer 3 (Bottom Disk) -->
  <g transform="translate(106, 270)">
    <!-- Cylinder Body -->
    <path d="M 0,38 C 0,72 134,72 300,38 L 300,78 C 300,112 0,112 0,78 Z" fill="url(#discGrad1)" opacity="0.9" />
    <path d="M 0,38 A 150 38 0 0 0 300 38 L 300 78 A 150 38 0 0 1 0 78 Z" fill="url(#discGrad1)" />
    <!-- Bottom Disc Cap -->
    <ellipse cx="150" cy="38" rx="150" ry="38" fill="url(#discTopGrad)" />
  </g>

  <!-- Layer 2 (Middle Disk) -->
  <g transform="translate(106, 200)">
    <!-- Cylinder Body -->
    <path d="M 0,38 A 150 38 0 0 0 300 38 L 300 78 A 150 38 0 0 1 0 78 Z" fill="url(#discGrad2)" />
    <!-- Middle Disc Cap -->
    <ellipse cx="150" cy="38" rx="150" ry="38" fill="url(#discTopGrad)" />
  </g>

  <!-- Layer 1 (Top Disk) -->
  <g transform="translate(106, 130)">
    <!-- Cylinder Body -->
    <path d="M 0,38 A 150 38 0 0 0 300 38 L 300 78 A 150 38 0 0 1 0 78 Z" fill="url(#discGrad2)" />
    <!-- Top Disc Cap -->
    <ellipse cx="150" cy="38" rx="150" ry="38" fill="url(#discTopGrad)" />
    <!-- Inner Core Highlight -->
    <ellipse cx="150" cy="38" rx="130" ry="30" fill="#e0f2fe" opacity="0.4" />
  </g>

  <!-- Speed Lightning / Query Pulse Symbol -->
  <path d="M 276 96 L 220 226 L 272 226 L 236 346 L 316 206 L 264 206 Z" fill="url(#accentGrad)" filter="url(#glow)" />
  <path d="M 276 96 L 220 226 L 272 226 L 236 346 L 316 206 L 264 206 Z" fill="#ffffff" opacity="0.9" />

  <!-- Status Indicator Dot (Active Connection) -->
  <circle cx="396" cy="116" r="14" fill="#22c55e" filter="url(#glow)" />
  <circle cx="396" cy="116" r="8" fill="#ffffff" />
</svg>
